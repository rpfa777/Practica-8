<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Practica 8 Periodico</title>
    <style>
        body {
            background-color: #e6f0fa;
            color: #000000;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        .contenedor {
            max-width: 1100px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 15px;
            border: 1px solid #000000;
            box-sizing: border-box;
        }
        .encabezado-superior {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
        }
        .titulo-principal {
            font-family: Georgia, serif;
            font-size: 2.2rem;
            margin: 0;
        }
        nav {
            text-align: center;
            margin: 10px 0;
        }
        nav a {
            color: #000000;
            text-decoration: none;
            font-size: 1rem;
            margin: 0 10px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        hr {
            border: 0;
            border-top: 1px solid #000000;
            margin: 10px 0;
        }
        .seccion-principal {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        .columna-izquierda {
            width: 68%;
            border: 1px solid #000000;
            padding: 15px;
            box-sizing: border-box;
        }
        .columna-derecha {
            width: 30%;
        }
        .grid-tres-columnas {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .columna-interna {
            flex: 1;
        }
        .columna-interna h3, .columna-derecha h2 {
            font-family: Georgia, serif;
            margin-top: 0;
        }
        .columna-interna p, .columna-derecha p {
            font-size: 13px;
            line-height: 1.4;
        }
        .meta-info {
            font-size: 11px;
            color: #555555;
        }
        .imagen-noticia {
            width: 100%;
            height: auto;
            margin-top: 8px;
            border: 1px solid #000000;
        }
        footer {
            text-align: center;
            font-size: 13px;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <header>
            <div class="encabezado-superior">
                <div>
                    <h1 class="titulo-principal">Practica 8 Periodico</h1>
                </div>
            </div>
        </header>

        <!-- Navegación únicamente con Noticias y Formulario -->
        <nav>
            <a href="noticias.html"><b>Noticias</b></a> |
            <a href="formulario.html"><b>Formulario</b></a>
            <hr>
        </nav>

        <main>
            <div class="seccion-principal">
                
                <!-- Columna Izquierda con las noticias de Hades66 y Bizarrap -->
                <div class="columna-izquierda">
                    <div class="grid-tres-columnas">
                        
                        <!-- Noticia Hades66 -->
                        <div class="columna-interna">
                            <h3>Lanzan un vaso de cristal al rapero Hades66 en pleno concierto</h3>
                            <img src="img.png" alt="Hades66" class="imagen-noticia">
                            <span class="meta-info"></span>
                        </div>

                        <!-- Noticia Bizarrap -->
                        <div class="columna-interna">
                            <h3>El productor musical "Bizarrap" participará en la película "Toy Story 5" como doblaje de voz.</h3>
                            <img src="immg.png" alt="Bizarrap en Toy Story" class="imagen-noticia">
                            <span class="meta-info"></span>
                        </div>

                    </div>
                </div>

                <!-- Columna Derecha con la noticia del espacio -->
                <div class="columna-derecha">
                    <h2>Captan señal de radio fuera del sistema solar.</h2>
                    <img src="immmmg.png" alt="Señal de radio en el espacio" class="imagen-noticia">
                    <span class="meta-info"></span>
                </div>

            </div>
        </main>

        <hr>

        <footer>
            <p>Ramos Flores Alexis<br>5-i<br>0643</p>
        </footer>
    </div>

</body>
</html>
